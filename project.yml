name: WorkoutTracker
options:
  bundleIdPrefix: com.qerim.dlamsd02
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: "XK6F49MN8K"
    CODE_SIGN_STYLE: Automatic
targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - path: WorkoutTracker
    resources:
      - path: WorkoutTracker/Resources/Fonts
      - path: WorkoutTracker/Assets.xcassets
    info:
      path: WorkoutTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Manrope-Variable.ttf
        NSHealthShareUsageDescription: "Wird benötigt, um Trainingseinheiten aus Apple Health zu importieren und Doppelerfassung zu vermeiden."
        NSHealthUpdateUsageDescription: "Wird benötigt, um abgeschlossene Krafttrainings-Sessions in Apple Health zu speichern."
    entitlements:
      path: WorkoutTracker/WorkoutTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qerim.dlamsd02.workouttracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WorkoutTrackerTests
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
        WorkoutTrackerTests: [test]
    test:
      targets:
        - WorkoutTrackerTests
